<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ profile.full_name }} — {{ profile.title }}">
    <title>{{ profile.full_name }} — {{ profile.title }}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="bg-effects" aria-hidden="true">
        <div class="bg-grid"></div>
        <div class="bg-glow bg-glow--cyan"></div>
        <div class="bg-glow bg-glow--orange"></div>
        <div class="bg-glow bg-glow--purple"></div>
        <canvas id="particles"></canvas>
    </div>

    <header class="header" id="header">
        <nav class="nav container">
            <a href="#hero" class="nav__logo">
                <span class="nav__logo-bracket">&lt;</span>{{ profile.name }}<span class="nav__logo-bracket">/&gt;</span>
            </a>
            <button class="nav__toggle" id="nav-toggle" aria-label="Меню" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav__menu" id="nav-menu">
                <li><a href="#about" class="nav__link">Обо мне</a></li>
                <li><a href="#skills" class="nav__link">Навыки</a></li>
                <li><a href="#experience" class="nav__link">Опыт</a></li>
                <li><a href="#projects" class="nav__link">Проекты</a></li>
                <li><a href="#contacts" class="nav__link nav__link--cta">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container footer__inner">
            <p class="footer__text">
                &copy; {{ profile.full_name }} — Python Backend Developer
            </p>
            <p class="footer__mono">built with FastAPI + ♥</p>
        </div>
    </footer>

    <div class="media-modal" id="media-modal" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="media-modal__backdrop" data-media-close></div>
        <div class="media-modal__dialog">
            <button class="media-modal__close" type="button" data-media-close aria-label="Закрыть">&times;</button>
            <h3 class="media-modal__title" id="media-modal-title"></h3>
            <div class="laptop">
                <div class="laptop__screen">
                    <div class="laptop__toolbar">
                        <span class="dot dot--red"></span>
                        <span class="dot dot--yellow"></span>
                        <span class="dot dot--green"></span>
                        <span class="laptop__url" id="media-modal-url">portfolio.demo</span>
                    </div>
                    <div class="laptop__content" id="media-modal-content"></div>
                </div>
                <div class="laptop__base"></div>
                <div class="laptop__shadow"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js?v=5"></script>
</body>
</html>
